server:
  port: ${PORT:8085}

spring:
  application:
    name: payment-service

  datasource:
    url:  jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pharmacy_payment}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2205}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Set RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET in backend/.env. No defaults on purpose.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

app:
  # Used by OpenApiConfig to set the server URL in Swagger docs
  gateway-url: http://localhost:8089
  # Direct service URLs for service-to-service calls (not the gateway).
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8084}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_API_TOKEN:6uU9zx0CUpYsgi7yNdf_jHnHmutiDQPkXdpOkQnr_Fw}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pharmacy.payment: INFO


